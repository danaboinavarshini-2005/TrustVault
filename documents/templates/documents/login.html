<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
        }

        a {
            color: #1e3a8a;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>TrustVault</h1>
        <p>Secure Document Sharing</p>

        {% if form.errors %}
            <p class="error">Incorrect username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
